<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정할 것 목록 — 89.5</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a0e;--card:#141218;--card2:#1a171f;--line:#2a2630;--ink:#ece8e2;--muted:#8e8a93;--red:#ff2440;--ok:#3dd68c;--warn:#f5c400}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;line-height:1.6;word-break:keep-all}
.wrap{width:min(860px,100% - 32px);margin:0 auto;padding:48px 0 120px}
.eyebrow{font-family:"Share Tech Mono",monospace;color:var(--red);letter-spacing:.3em;font-size:13px}
h1{font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(30px,5vw,44px);line-height:1.25;margin:8px 0 10px}
.lead{color:#bdb8c2}
.lead a{color:#ff8a98}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 8px}
.stat{flex:1 1 200px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat small{color:var(--muted);font-size:13px}
.stat b{display:block;font-family:"Share Tech Mono",monospace;font-size:26px}
.bar{height:6px;border-radius:6px;background:#26222b;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.stat.opt .bar i{background:var(--warn)}
h2{display:flex;align-items:center;gap:10px;font-size:20px;margin:44px 0 6px}
h2 .tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--red);color:#fff}
h2 .tag.opt{background:var(--warn);color:#111}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin-bottom:12px;transition:border-color .2s}
.item.done{border-color:rgba(61,214,140,.55)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-family:"Share Tech Mono",monospace;color:var(--red);font-size:18px}
.opt-sec .num{color:var(--warn)}
.label{font-weight:900;font-size:17px}
.check{margin-left:auto;font-size:12px;color:var(--muted)}
.item.done .check{color:var(--ok)}
.desc{color:#a9a4ae;font-size:14px;margin-top:4px}
.now{margin-top:10px;font-size:13px;color:var(--muted)}
.now span{color:#d7d2da;background:var(--card2);border:1px dashed #3a3540;border-radius:6px;padding:1px 8px}
textarea{display:block;width:100%;margin-top:10px;min-height:46px;resize:vertical;background:#0f0e12;color:var(--ink);border:1px solid #34303a;border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
textarea:focus{outline:2px solid rgba(255,36,64,.5);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid #3a3540;background:var(--card2);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--red)}
.chip small{color:var(--muted);margin-left:4px}
.where{margin-top:8px;font-size:12px;color:#6f6a76;font-family:"Share Tech Mono",monospace}
.actions{position:sticky;bottom:12px;margin-top:32px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(20,18,24,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:12px}
.btn{border:0;border-radius:12px;padding:13px 18px;font:700 15px "Noto Sans KR",sans-serif;cursor:pointer;color:#fff;background:var(--red)}
.btn.ghost{background:#26222b}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1a1620;border:1px solid var(--ok);padding:12px 18px;border-radius:12px;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">89.5 · 과학실 15분</p>
  <h1>홈페이지 정보, 정할 것 14가지</h1>
  <p class="lead">지금 <a href="./">홈페이지</a>에는 임시값이 들어가 있어요. 정한 내용을 칸에 적고 <b>"전체 복사"</b>를 눌러 Claude에게 붙여넣으면 홈페이지에 반영돼요. 적은 내용은 이 브라우저에만 저장돼요.</p>

  <div class="stats">
    <div class="stat"><small>꼭 필요한 것</small><b id="reqCount">0 / 8</b><div class="bar"><i id="reqBar"></i></div></div>
    <div class="stat opt"><small>정하면 좋은 것</small><b id="optCount">0 / 6</b><div class="bar"><i id="optBar"></i></div></div>
  </div>

  <section>
    <h2><span class="tag">필수</span>꼭 필요한 것</h2>
    <p class="sub">신청을 받기 전에 정해야 해요.</p>
    <div id="req"></div>
  </section>

  <section class="opt-sec">
    <h2><span class="tag opt">선택</span>정하면 좋은 것</h2>
    <p class="sub">그대로 둬도 홈페이지는 동작해요.</p>
    <div id="opt"></div>
  </section>

  <div class="actions">
    <button class="btn" id="copy">전체 복사</button>
    <button class="btn ghost" id="reset">입력 지우기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ITEMS = [
  {n:1, g:'req', label:'구글폼 신청 링크', desc:'신청 버튼을 누르면 이동할 주소. 구글폼에서 [보내기] → 링크 복사.', now:'없음 (누르면 "곧 열립니다" 안내)', where:'config.js → formUrl', ph:'https://forms.gle/...'},
  {n:2, g:'req', label:'운영 주체', desc:'학교·동아리 이름. 페이지 맨 아래에 표시돼요.', now:'○○고등학교 ○○동아리', where:'config.js → host'},
  {n:3, g:'req', label:'일시', desc:'축제 날짜와 운영 시간.', now:'축제 1·2일차 10:00 – 16:00', where:'config.js → info'},
  {n:4, g:'req', label:'장소', desc:'부스가 열리는 곳.', now:'본관 3층 과학실', where:'config.js → info'},
  {n:5, g:'req', label:'회차당 인원', desc:'한 번에 들어가는 인원.', now:'2 – 4명', where:'config.js → info'},
  {n:6, g:'req', label:'소요 시간', desc:'게임 시간과 설명 포함 전체 시간.', now:'15분 (설명 포함 약 20분)', where:'config.js → info'},
  {n:7, g:'req', label:'참가비', desc:'무료 또는 금액.', now:'무료', where:'config.js → info', chips:['무료','500원','1,000원']},
  {n:8, g:'req', label:'대상·주의', desc:'참가 가능 대상과 공포 연출 안내.', now:'누구나 · 공포 연출 있음', where:'config.js → info'},
  {n:9, g:'opt', label:'게임 제목', desc:'후보를 누르면 칸에 들어가요.', now:'89.5', where:'config.js → title',
    chips:[['89.5','숫자로 궁금증'],['과학실 15분','직관적'],['증거인멸','장르가 한 단어로'],['서술형 4번','학생 공감'],['경찰이 오기 전에','긴박감']]},
  {n:10, g:'opt', label:'부제', desc:'제목 옆에 붙는 짧은 문구.', now:'과학실 15분', where:'config.js → subtitle'},
  {n:11, g:'opt', label:'참가 안내 문구 (3줄)', desc:'사건 파일 아래 안내. 한 줄에 하나씩 적어 주세요.', now:'5분 전 도착 / 소품은 안전, 무리한 힘 금지 / 어두운 조명·효과음, 언제든 중단 가능', where:'config.js → notice'},
  {n:12, g:'opt', label:'시험지 소품 문구', desc:'스토리 섹션 시험지의 시험명·문항.', now:'2학기 중간고사 · 과학 / 서술형 4번', where:'index.html (시험지)'},
  {n:13, g:'opt', label:'미션 카드 설명', desc:'실제 퍼즐 구성에 맞게 바꿀지. 그대로면 "그대로"라고 적어 주세요.', now:'추리하라 / 지워라 / 탈출하라', where:'index.html (미션 카드)'},
  {n:14, g:'opt', label:'시험지 학년·반 표기', desc:'시험지 상단 이름 칸.', now:'3학년 ○반 ○번 · 이름: 나', where:'index.html (시험지)'},
];
const KEY = 'escape895-decisions';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

ITEMS.forEach(it => {
  const el = document.createElement('div');
  el.className = 'item';
  const chips = (it.chips || []).map(c => Array.isArray(c) ? c : [c, '']).map(([v, h]) =>
    `<button class="chip" data-v="${esc(v)}">${esc(v)}${h ? `<small>${esc(h)}</small>` : ''}</button>`).join('');
  el.innerHTML = `
    <div class="head"><span class="num">${String(it.n).padStart(2,'0')}</span><span class="label">${esc(it.label)}</span><span class="check">미정</span></div>
    <p class="desc">${esc(it.desc)}</p>
    <p class="now">지금: <span>${esc(it.now)}</span></p>
    ${chips ? `<div class="chips">${chips}</div>` : ''}
    <textarea rows="1" placeholder="${esc(it.ph || '정한 내용을 적어 주세요')}"></textarea>
    <p class="where">수정 위치: ${esc(it.where)}</p>`;
  const ta = el.querySelector('textarea');
  ta.value = saved[it.n] || '';
  const sync = () => { saved[it.n] = ta.value; save(); el.classList.toggle('done', !!ta.value.trim()); el.querySelector('.check').textContent = ta.value.trim() ? '✓ 정함' : '미정'; update(); };
  ta.addEventListener('input', sync);
  el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { ta.value = b.dataset.v; sync(); }));
  document.getElementById(it.g).appendChild(el);
  it.sync = sync;
});

function update(){
  ['req','opt'].forEach(g => {
    const all = ITEMS.filter(i => i.g === g), done = all.filter(i => (saved[i.n] || '').trim()).length;
    document.getElementById(g + 'Count').textContent = `${done} / ${all.length}`;
    document.getElementById(g + 'Bar').style.width = (done / all.length * 100) + '%';
  });
}
ITEMS.forEach(i => i.sync());

const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };
document.getElementById('copy').addEventListener('click', async () => {
  const lines = ['[89.5 홈페이지 정보 수정]'];
  ITEMS.forEach(i => { const v = (saved[i.n] || '').trim(); lines.push(`${i.n}. ${i.label}: ${v || '(미정 — 임시값 유지)'}`); });
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); toast('복사했어요. Claude에게 붙여넣어 주세요.'); }
  catch (e) { prompt('아래 내용을 복사해 주세요', text); }
});
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('적은 내용을 모두 지울까요?')) return;
  saved = {}; save();
  document.querySelectorAll('textarea').forEach(t => t.value = '');
  ITEMS.forEach(i => i.sync());
});
</script>
</body>
</html>
